<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MatchLens{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f7f5; --surface: #ffffff; --text: #1d1f21; --muted: #6b6f76; --line: #e3e3df;
      --win: #1f8a4c; --draw: #b58a12; --loss: #c0392b; --bar: #3563c9; --link: #2a55b8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181b; --surface: #1f2226; --text: #e8e8e6; --muted: #9aa0a8; --line: #2e3237;
        --win: #3fbf73; --draw: #d9ad35; --loss: #e5675a; --bar: #6f95f0; --link: #8fb0f5;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav.top { font-size: .85rem; color: var(--muted); margin-bottom: 12px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 32px 0 10px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 12px; }
    label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
    input, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line);
                    border-radius: 6px; background: var(--surface); color: var(--text); }
    button { cursor: pointer; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
    th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
    th.l, td.l { text-align: left; }
    tr:last-child td { border-bottom: 0; }
    .res { display: inline-block; width: 1.6em; text-align: center; border-radius: 4px; color: #fff; font-weight: 600; }
    .W { background: var(--win); } .D { background: var(--draw); } .L { background: var(--loss); }
    .form { font-family: ui-monospace, monospace; letter-spacing: .15em; }
    .bar { position: relative; min-width: 140px; }
    .bar span { position: absolute; inset: 6px auto 6px 0; background: var(--bar); opacity: .25; border-radius: 3px; }
    .bar b { position: relative; font-weight: 600; }
    .empty { padding: 32px; text-align: center; color: var(--muted); }
    .note { color: var(--muted); font-size: .85rem; margin-top: 8px; }
    footer { color: var(--muted); font-size: .8rem; margin-top: 40px; }
  </style>
</head>
<body>
<main>
  {% block content %}{% endblock %}
  <footer>Data: StatsBomb open data. xG values are StatsBomb's own model output, not computed here.</footer>
</main>
</body>
</html>
