# MatchLens local stack.
#   docker compose up --build            db -> loader (one-shot import) -> api
#   docker compose run --rm loader       re-run the import (idempotent)
#   docker compose --profile test run --rm tests
name: matchlens

x-app-image: &app-image
  image: matchlens:latest
  build:
    context: .
    target: runtime

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matchlens}
      POSTGRES_USER: ${POSTGRES_USER:-matchlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MATCHLENS_RO_USER: ${MATCHLENS_RO_USER:-matchlens_ro}
      MATCHLENS_RO_PASSWORD: ${MATCHLENS_RO_PASSWORD:?set MATCHLENS_RO_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  loader:
    <<: [*app-image, *hardening]
    command: ["python", "-m", "loader.cleaner", "--data-dir", "/data/statsbomb"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-matchlens}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-matchlens}
      MATCHLENS_EXPECTED_MATCHES: ${MATCHLENS_EXPECTED_MATCHES:-38}
      MATCHLENS_EXPECTED_SHOTS: ${MATCHLENS_EXPECTED_SHOTS:-1042}
      MATCHLENS_COMPETITION_ID: ${MATCHLENS_COMPETITION_ID:-2}
      MATCHLENS_SEASON_ID: ${MATCHLENS_SEASON_ID:-27}
      MATCHLENS_TEAM_ID: ${MATCHLENS_TEAM_ID:-22}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: [*app-image, *hardening]
    restart: unless-stopped
    environment:
      MATCHLENS_TEAM_ID: ${MATCHLENS_TEAM_ID:-22}
      # Read-only role: the API can SELECT and nothing else.
      DATABASE_URL: postgresql+psycopg://${MATCHLENS_RO_USER:-matchlens_ro}:${MATCHLENS_RO_PASSWORD}@db:5432/${POSTGRES_DB:-matchlens}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: matchlens:test
    <<: *hardening
    environment:
      # Owner role: the suite creates and drops its own throwaway schema.
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-matchlens}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-matchlens}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
